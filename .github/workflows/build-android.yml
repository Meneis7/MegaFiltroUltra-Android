name: Build Mega Filtro V9

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Monta interface e ajustes V9
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi
          cat parts/index.part00 parts/index.part01 parts/index.part02 parts/index.part03 parts/index.part04 parts/index.part05 > app/src/main/assets/index.html
          cat v9icon_parts/icon.part00 v9icon_parts/icon.part01 v9icon_parts/icon.part02 v9icon_parts/icon.part03 v9icon_parts/icon.part04 | base64 -d > app/src/main/res/drawable-nodpi/ic_launcher.png

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('app/src/main/assets/index.html')
          s = html.read_text(encoding='utf-8')
          s = s.replace('<title>Mega_Filtro_Ultra_V5_3</title>', '<title>Mega_Filtro_V9</title>')
          s = s.replace('.wrap{max-width:500px;margin:auto;padding:4px}', '''.wrap{\n  width:100%;max-width:560px;margin:0 auto;\n  padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 18px) calc(env(safe-area-inset-left,0px) + 12px);\n}''')
          responsive = '''\n.compactControls{display:flex;align-items:flex-end;justify-content:center;gap:12px;flex-wrap:nowrap;margin:8px 0 10px}\n.miniField{width:90px;flex:0 0 90px}\n#generate{flex:0 1 230px}\n#stop{flex:0 0 auto}\n@media (max-width:600px){\n  .card{padding:18px 14px;border-radius:20px}\n  .compactControls{display:grid!important;grid-template-columns:100px minmax(0,1fr);align-items:end;justify-content:stretch;gap:10px!important}\n  .miniField{width:100px!important;min-width:0;justify-self:center}\n  #generate{width:100%;min-width:0!important;padding:12px 8px}\n  #stop{grid-column:1/-1;justify-self:center;min-width:120px}\n  .progressline{flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}\n  .results{margin-top:14px}\n}\n@media (max-width:380px){\n  #generate{font-size:13px}\n}\n'''
          s = s.replace('header,.sidepanel,.note,.footer{display:none!important}', responsive + '\nheader,.sidepanel,.note,.footer{display:none!important}')
          html.write_text(s, encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          if 'android:icon=' not in m:
              m = m.replace('<application\n', '<application\n        android:icon="@drawable/ic_launcher"\n        android:roundIcon="@drawable/ic_launcher"\n', 1)
          if 'android:configChanges=' not in m:
              m = m.replace('android:screenOrientation="unspecified"', 'android:screenOrientation="unspecified"\n            android:configChanges="orientation|screenSize|smallestScreenSize|keyboardHidden"')
          manifest.write_text(m, encoding='utf-8')

          java = Path('app/src/main/java/com/megafiltro/ultra/MainActivity.java')
          j = java.read_text(encoding='utf-8')
          if 'import android.content.res.Configuration;' not in j:
              j = j.replace('import android.app.Activity;\n', 'import android.app.Activity;\nimport android.content.res.Configuration;\n')
          if 'onConfigurationChanged(Configuration newConfig)' not in j:
              block = '''\n    @Override\n    public void onConfigurationChanged(Configuration newConfig) {\n        super.onConfigurationChanged(newConfig);\n    }\n\n'''
              j = j.replace('    @Override\n    public void onBackPressed() {', block + '    @Override\n    public void onBackPressed() {')
          java.write_text(j, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = re.sub(r'versionCode\s+\d+', 'versionCode 9', g)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "9.0"', g)
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Confere V9 antes do build
        run: |
          grep -q 'configChanges="orientation|screenSize|smallestScreenSize|keyboardHidden"' app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'onConfigurationChanged' app/src/main/java/com/megafiltro/ultra/MainActivity.java
          grep -q 'versionCode 9' app/build.gradle
          test -s app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Build APK V9
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomeia APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Mega_Filtro_V9.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mega_Filtro_V9
          path: Mega_Filtro_V9.apk
