name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstroi interface V5.3
        run: |
          mkdir -p app/src/main/assets
          cat parts/index.part00 parts/index.part01 parts/index.part02 parts/index.part03 parts/index.part04 parts/index.part05 > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomeia APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Mega_Filtro_Ultra_Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mega_Filtro_Ultra_Android
          path: Mega_Filtro_Ultra_Android.apk
