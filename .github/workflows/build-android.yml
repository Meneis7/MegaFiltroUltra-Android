name: Build Mega Filtro Ultra V3.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Monta Mega Filtro Ultra V3.4
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable-nodpi
          cat v34_parts/index.part00 v34_parts/index.part01 v34_parts/index.part02 v34_parts/index.part03 v34_parts/index.part04 > app/src/main/assets/index.html
          base64 -d v9_1icon_webp.b64 > app/src/main/res/drawable-nodpi/ic_launcher.webp

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          m = re.sub(r'android:label="[^"]*"', 'android:label="Mega Filtro Ultra V3.4"', m)
          if 'android:icon=' not in m:
              m = m.replace('<application\n', '<application\n        android:icon="@drawable/ic_launcher"\n        android:roundIcon="@drawable/ic_launcher"\n', 1)
          if 'android:configChanges=' not in m:
              m = m.replace('android:screenOrientation="unspecified"', 'android:screenOrientation="unspecified"\n            android:configChanges="orientation|screenSize|smallestScreenSize|keyboardHidden"')
          manifest.write_text(m, encoding='utf-8')

          java = Path('app/src/main/java/com/megafiltro/ultra/MainActivity.java')
          j = java.read_text(encoding='utf-8')
          if 'import android.content.res.Configuration;' not in j:
              j = j.replace('import android.app.Activity;\n', 'import android.app.Activity;\nimport android.content.res.Configuration;\n')
          if 'onConfigurationChanged(Configuration newConfig)' not in j:
              block = '''\n    @Override\n    public void onConfigurationChanged(Configuration newConfig) {\n        super.onConfigurationChanged(newConfig);\n    }\n\n'''
              j = j.replace('    @Override\n    public void onBackPressed() {', block + '    @Override\n    public void onBackPressed() {')
          java.write_text(j, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          g = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.megafiltro.ultra.v34"', g)
          g = re.sub(r'versionCode\s+\d+', 'versionCode 34', g)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "3.4"', g)
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Confere V3.4 antes do build
        run: |
          grep -q '<title>Mega_Filtro_Ultra_V3_4</title>' app/src/main/assets/index.html
          grep -q 'MEGA <span>FILTRO ULTRA</span> V3.4' app/src/main/assets/index.html
          grep -q 'applicationId "com.megafiltro.ultra.v34"' app/build.gradle
          grep -q 'versionName "3.4"' app/build.gradle
          grep -q 'configChanges="orientation|screenSize|smallestScreenSize|keyboardHidden"' app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/ic_launcher"' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable-nodpi/ic_launcher.webp

      - name: Build APK V3.4
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomeia APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Mega_Filtro_Ultra_V3_4.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mega_Filtro_Ultra_V3_4
          path: Mega_Filtro_Ultra_V3_4.apk
